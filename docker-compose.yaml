# docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  broke-server:
    restart: always
    image: ghcr.io/valteryde/broke:latest
    # To build from source instead, comment out 'image' and uncomment 'build':
    # build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data
    environment:
      - DATA_PATH=/data
      - REDIS_URL=redis://redis:6379
      - UPDATER_URL=http://broke-updater:9999
      - IP_URL=http://broke-ip:9998
      # Optional: disable in-app updater UI/API/background checks (comma-separated ids):
      # - BROKE_DISABLED_FEATURES=updater,usage
      # Usage city lookup talks to broke-ip on the compose network. Do not default
      # community installs at a public ip.broke.dk — that would send visitor IPs off-box.
      # SaaS: IP_URL=https://ip.broke.dk and IP_TOKEN=<service token>
      # - IP_TOKEN=
      # Usage lake: how long events are kept, and the distinct-route cap.
      # - USAGE_RETENTION_DAYS=365
      # - USAGE_MAX_ROUTES=5000
      # Telegraf metrics: how long full-resolution points are kept, and the per-host
      # series cap that stops a misconfigured agent flooding the lake.
      # - METRICS_RETENTION_DAYS=365
      # - METRICS_MAX_SERIES_PER_HOST=5000
      # Set to 0 and enable the broke-metrics service below to compact out-of-process:
      # - METRICS_COMPACTION_IN_PROCESS=1
      # Only for legacy v1 clients that cannot send a header: allows ?p=<token>, which
      # leaks the token into every access log along the way.
      # - METRICS_ALLOW_QUERY_TOKEN=0
    depends_on:
      - redis

  broke-ip:
    build: ./ip
    restart: always
    volumes:
      - ip_data:/data
    environment:
      - IP_DATA_DIR=/data
      # Set IP_SERVICE_TOKEN when this process is published on the internet.
      # - IP_SERVICE_TOKEN=

  broke-updater:
    build: ./updater
    restart: always
    user: "0"  # Run as root to access Docker socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
    environment:
      - COMPOSE_PROJECT=broke
      - TARGET_SERVICE=broke-server
      - TARGET_IMAGE=ghcr.io/valteryde/broke:latest

  broke-monitor:
    restart: always
    image: ghcr.io/valteryde/broke:latest
    # To build from source instead, comment out 'image' and uncomment 'build':
    # build: .
    command: ["python", "-m", "app.monitor_worker"]
    volumes:
      - data:/data
    environment:
      - DATA_PATH=/data
      # Optional: disable monitors (comma-separated ids):
      # - BROKE_DISABLED_FEATURES=monitors
      # - MONITOR_POLL_SECONDS=10
      # - APP_BASE_URL=https://broke.example.com
    depends_on:
      - broke-server

  # Optional: run metrics compaction in its own process instead of inside the web
  # workers. Only useful with METRICS_COMPACTION_IN_PROCESS=0 on broke-server.
  # broke-metrics:
  #   restart: always
  #   image: ghcr.io/valteryde/broke:latest
  #   command: ["python", "-m", "app.metrics_worker"]
  #   volumes:
  #     - data:/data
  #   environment:
  #     - DATA_PATH=/data
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     - broke-server

volumes:
  data:
  redis_data:
  ip_data:
